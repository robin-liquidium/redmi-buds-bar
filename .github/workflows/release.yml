name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag; leave empty to resume a draft'
        type: string
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
concurrency:
  group: redmi-buds-release
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        shell: bash
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/robin-liquidium/redmi-buds-bar/releases --jq '[.[] | select(.draft)] | sort_by(.created_at) | first | .tag_name // empty')"
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 2; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
  notarize:
    needs: select
    if: needs.select.outputs.tag != ''
    runs-on: macos-26
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.select.outputs.tag }}
      SIGNING_IDENTITY: 'Developer ID Application: Robin Obermaier (5S5288W3R7)'
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Import signing credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: ./script/ci_credentials.sh
      - run: brew install create-dmg
      - run: python3 script/release.py "$RELEASE_TAG"
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/redmi-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/redmi-notary.p8" "$RUNNER_TEMP/redmi-developer.p12"
