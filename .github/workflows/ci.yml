name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: ./script/package_app.sh --universal
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project iOS/RedmiBuds.xcodeproj -scheme RedmiBuds -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath work/ios-ci CODE_SIGNING_ALLOWED=NO build
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile && bun run check && bun run build
        working-directory: website
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
